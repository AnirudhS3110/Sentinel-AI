# Monorepo API service — set Railway service root to repo root (not apps/api).
[build]
buildCommand = "npm ci && npm run build --workspace=@sentinel/shared && npm run build --workspace=api"

[deploy]
startCommand = "npm run start:prod --workspace=api"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
